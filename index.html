<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Rocket Dash</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { margin:0; height:100%; overflow:hidden; background:#000; font-family: Arial, Helvetica, sans-serif; }
    #overlay { position:absolute; left:0; top:0; pointer-events:none; }
    #ui {
      position: absolute; left: 12px; top: 12px; color: #fff; z-index: 10;
      background: rgba(0,0,0,0.25); padding:8px 12px; border-radius:6px;
      backdrop-filter: blur(4px);
    }
    #hint { position:absolute; right:12px; top:12px; color:#fff; background:rgba(0,0,0,0.25); padding:8px 12px; border-radius:6px; }
    canvas { display:block; }
    .small { font-size:0.9em; color:#ddd }

    /* Start screen */
    #startScreen {
      position: absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.6));
      color: #fff; flex-direction: column;
    }
    #startCard { width: 360px; max-width: 90%; background: rgba(10,10,20,0.7); padding: 22px; border-radius: 12px; text-align:center; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    #startCard h1 { margin: 4px 0 10px; font-size: 24px; }
    #startCard p { margin: 8px 0 16px; color:#dfeff0; }
    #startBtn { background: #2dd17f; border:none; color:#02110b; padding: 10px 18px; font-size:16px; border-radius:8px; cursor:pointer; }
    #startBtn:hover { filter:brightness(1.05); }
    #controls { margin-top:12px; color:#bcd; font-size:14px }
  </style>
</head>
<body>
  <div id="ui">
    <div>Level: <span id="level">1</span></div>
    <div>Score: <span id="score">0</span></div>
    <div class="small">Spatie = doorspoelen</div>
  </div>
  <div id="hint">Wit pijltje = ver, 🔔 rood = dichtbij, alien = vijand</div>
  <canvas id="overlay"></canvas>

  <div id="startScreen">
    <div id="startCard">
      <h1>Rocket Dash</h1>
      <p>Je bent de raket. Veeg meteorieten en vijanden weg. Druk op Spatie om te doorspoelen.</p>
      <button id="startBtn">Start</button>
      <div id="controls">Pijltjestoetsen = draaien (niet nodig). Spatie = doorspoelen</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
